name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/status-page/**'
  workflow_dispatch:

concurrency:
  group: deploy-status-page
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: infrastructure/status-page

      - name: Build Astro
        run: pnpm build
        working-directory: infrastructure/status-page

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: orkenta-status-page
          directory: infrastructure/status-page/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
