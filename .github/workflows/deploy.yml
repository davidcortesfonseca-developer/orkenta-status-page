name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'history/**'
      - 'incidents/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: deploy-status-page
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build Astro
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: orkenta-status-page
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
